<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#004D40" />
    <title>Heritogo - Mode hors ligne</title>
    <style>
      :root {
        color-scheme: light;
        --forest: #004d40;
        --rust: #bf360c;
        --gold: #f57f17;
        --cream: #f3f0dc;
        --ink: #101815;
        --muted: #5f6f68;
        --line: rgba(0, 77, 64, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, rgba(0, 77, 64, 0.08), rgba(245, 127, 23, 0.08)), var(--cream);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 560px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(0, 40, 32, 0.14);
        overflow: hidden;
      }

      .hero {
        padding: 34px 28px 28px;
        color: #fff;
        background: linear-gradient(135deg, rgba(0, 77, 64, 0.96), rgba(0, 77, 64, 0.82)), url("/deuxlions.png") center / cover;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 56px;
        font-weight: 900;
      }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: #fff;
      }

      h1 {
        margin: 0;
        max-width: 420px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.35rem, 8vw, 4.3rem);
        font-style: italic;
        line-height: 0.96;
      }

      .body { padding: 28px; }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a, button {
        min-height: 48px;
        border-radius: 8px;
        padding: 0 18px;
        border: 0;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 900;
        text-decoration: none;
        cursor: pointer;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: var(--forest);
      }

      button {
        color: var(--forest);
        background: #fff;
        border: 1px solid var(--line);
      }

      .hint {
        margin-top: 18px;
        font-size: 0.86rem;
      }

      @media (max-width: 520px) {
        main { padding: 14px; }
        .hero, .body { padding-left: 20px; padding-right: 20px; }
        .actions { flex-direction: column; }
        a, button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="offline-title">
        <div class="hero">
          <div class="brand">
            <img src="/icons/icon-192x192.png" alt="" />
            <span>Heritogo</span>
          </div>
          <h1 id="offline-title">Le voyage continue hors ligne.</h1>
        </div>
        <div class="body">
          <p>
            Votre connexion semble indisponible. Les pages deja visitees peuvent encore s'ouvrir,
            mais le scan IA, les reservations et les cartes ont besoin du reseau.
          </p>
          <div class="actions">
            <button type="button" onclick="window.location.reload()">Reessayer</button>
            <a href="/fr">Retour a l'accueil</a>
          </div>
          <p class="hint">Astuce: revenez sur cette page des que la connexion est retablie.</p>
        </div>
      </section>
    </main>
  </body>
</html>
